## Config for TES + TauID SF fit, FULL ParticleNet, mutau channel, by PNet-DM and pT.
## Full PNet: VSjet + VSe + VSmu ALL on ParticleNet raw scores (no DeepTau on any leg).
## Decay modes use PNet decay modes (decayModePNet_2); tau pt uses the PNet pt regression
## (pt_2*ptCorrPNet_2, where ptCorrPNet_2 is the native-NanoAOD Tau_ptCorrPNet factor ~1.0).
## DM12 design (after FranGCH config_coarse_PNet_TT_DM12): DM1 merges decay modes 1 and 2,
## plus a "recovAllDMs" category (HPS-invalid taus recovered by PNet). Drive with
## run_inputs_pnet_2526.sh / run_workflow_zmm_corrTES_pnet_2526.sh.
##
## NOTE vs the FranGCH DM12 config: the inclusive DM regions are NOT in fit/scan here (they
## double-count their own pT bins in the corrTES per-DM fit), so only the 15 pT-split regions
## are fit/scanned -- matching config_coarse_TT.yml / config_coarse_PNet.yml.

channel: mutau

tag: "_mutau"

# Tagger-generic block consumed by createinputsTES_pnet.py: each leg's cut is built as
# "<discriminant> >= wps[<WP>]" and injected at its $VSJET / $VSE / $VSMU placeholder below.
# VSjet WP is swept by the driver (-j); VSe/VSmu are fixed (mutau convention VVLoose VSe / Tight VSmu).
# NOTE: VSe/VSmu raw-score thresholds (0.1266 / 0.9451) are the FranGCH DM12 values -- confirm against
# the official PNet VSe-VVLoose / VSmu-Tight working points for 2526 before the production run.
tagger:
    id_label: "PNet"
    # Official PNet raw-score working points (2526). NOTE: VSe 0.1266 = VVVLoose (NOT VVLoose);
    # VSe VVLoose = 0.3547. The FranGCH DM12 config cut at 0.1266 (= VVVLoose).
    vsjet:
        discriminant: "rawPNetVSjet_2"
        wps:
            VVVLoose: 0.0565
            VVLoose:  0.1774
            VLoose:   0.3810
            Loose:    0.6857
            Medium:   0.8347
            Tight:    0.9059
            VTight:   0.9494
            VVTight:  0.9737
    vse:
        discriminant: "rawPNetVSe_2"
        wps:
            VVVLoose: 0.1266
            VVLoose:  0.3547
            VLoose:   0.6997
            Loose:    0.9354
            Medium:   0.9791
            Tight:    0.9897
            VTight:   0.9946
            VVTight:  0.9971
    vsmu:
        discriminant: "rawPNetVSmu_2"
        wps:
            VLoose: 0.2399
            Loose:  0.6037
            Medium: 0.8697
            Tight:  0.9451

# default WPs if the CLI -j/-e/-m are not given (the driver/condor DO pass -j for the sweep)
workingPoints:
    vsjet: Medium
    vse:   VVLoose
    vsmu:  Tight

# idDecayModeNewDMs_2 (HPS DM validity) is intentionally NOT in the baseline: it lives in the region
# definitions so that recovAllDMs = !idDecayModeNewDMs_2 is non-empty.
baselineCuts: "q_1*q_2<0 && iso_1<0.15 && !lepton_vetoes_notau && metfilter && $VSJET && $VSE && $VSMU && mt_1<65"

# 5 PNet decay-mode bins x 3 pT bins (pt = pt_2*ptCorrPNet_2). DM1 = PNet DM 1 or 2 merged;
# recovAllDMs = HPS-invalid taus recovered by PNet.
regions:
    DM0_pt1:
        definition: "decayModePNet_2==0 && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>20 && (pt_2*ptCorrPNet_2)<40"
        title: "h^{#pm}, pt: 20-40"
    DM0_pt2:
        definition: "decayModePNet_2==0 && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>=40 && (pt_2*ptCorrPNet_2)<60"
        title: "h^{#pm}, pt: 40-60"
    DM0_pt3:
        definition: "decayModePNet_2==0 && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>=60 && (pt_2*ptCorrPNet_2)<200"
        title: "h^{#pm}, pt: 60-200"
        binning: [11, 40, 150]   # pt3 -> 10 GeV
    DM1_pt1:
        definition: "(decayModePNet_2==1 || decayModePNet_2==2) && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>20 && (pt_2*ptCorrPNet_2)<40"
        title: "h^{#pm}#pi^{0}(#pi^{0}), pt: 20-40"
    DM1_pt2:
        definition: "(decayModePNet_2==1 || decayModePNet_2==2) && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>=40 && (pt_2*ptCorrPNet_2)<60"
        title: "h^{#pm}#pi^{0}(#pi^{0}), pt: 40-60"
    DM1_pt3:
        definition: "(decayModePNet_2==1 || decayModePNet_2==2) && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>=60 && (pt_2*ptCorrPNet_2)<200"
        title: "h^{#pm}#pi^{0}(#pi^{0}), pt: 60-200"
        binning: [11, 40, 150]   # pt3 -> 10 GeV
    DM10_pt1:
        definition: "decayModePNet_2==10 && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>20 && (pt_2*ptCorrPNet_2)<40"
        title: "h^{#pm}h^{#mp}h^{#pm}, pt: 20-40"
    DM10_pt2:
        definition: "decayModePNet_2==10 && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>=40 && (pt_2*ptCorrPNet_2)<60"
        title: "h^{#pm}h^{#mp}h^{#pm}, pt: 40-60"
    DM10_pt3:
        definition: "decayModePNet_2==10 && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>=60 && (pt_2*ptCorrPNet_2)<200"
        title: "h^{#pm}h^{#mp}h^{#pm}, pt: 60-200"
        binning: [11, 40, 150]   # pt3 -> 10 GeV
    DM11_pt1:
        definition: "decayModePNet_2==11 && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>20 && (pt_2*ptCorrPNet_2)<40"
        title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}, pt: 20-40"
        binning: [11, 40, 150]   # DM11 -> 10 GeV
    DM11_pt2:
        definition: "decayModePNet_2==11 && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>=40 && (pt_2*ptCorrPNet_2)<60"
        title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}, pt: 40-60"
        binning: [11, 40, 150]   # DM11 -> 10 GeV
    DM11_pt3:
        definition: "decayModePNet_2==11 && idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>=60 && (pt_2*ptCorrPNet_2)<200"
        title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}, pt: 60-200"
        binning: [11, 40, 150]   # DM11 + pt3 -> 10 GeV
    recovAllDMs:
        definition: "!idDecayModeNewDMs_2 && (pt_2*ptCorrPNet_2)>20 && (pt_2*ptCorrPNet_2)<200"
        title: "recov #tau (incl pt)"
        binning: [11, 40, 150]   # single inclusive region: pool ALL recovery taus, no pT split

plottingOrder: &region_list
          [
            "DM0_pt1", "DM0_pt2", "DM0_pt3",
            "DM1_pt1", "DM1_pt2", "DM1_pt3",
            "recovAllDMs",
            "DM10_pt1", "DM10_pt2", "DM10_pt3",
            "DM11_pt1", "DM11_pt2", "DM11_pt3",
          ]

observables:
    m_vis:
        binning: [22, 40, 150]
        title: "m_{vis}"
        extra:
            cut: "40<m_vis && m_vis<150"
        fitRegions:  *region_list
        scanRegions: *region_list

TESvariations:
    values : [0.950, 0.960 ,0.970, 0.980, 0.990, 1.010, 1.020, 1.030, 1.040, 1.050]
    processes: ["ZTT"]

fitSpecs:
    doBBB: doShapes
    signalBBB: True
    backgroundBBB: True

samples:
    filename: "$PICODIR/$SAMPLE_$CHANNEL$TAG.root"
    join: ["VV","TT","ST"]
    split:
        DY: [ ["ZTT","genmatch_2==5"], ["ZL","genmatch_2>0 && genmatch_2<5"], ["ZJ","genmatch_2==0"] ]
        TT: [["TTT","genmatch_2==5"], ["TTL","genmatch_2>0 && genmatch_2<5"], ["TTJ","genmatch_2==0"] ]
    rename:
        WJ: "W"
    data: "data_obs"
    removeSFs: ["idweight_2"]   # drop the DeepTau VSjet SF -- we measure PNet

tesRegions:
    DM0:            {title: "DM0"}
    DM1:            {title: "DM1"}
    recovAllDMs:    {title: "recovAllDMs"}
    DM10:           {title: "DM10"}
    DM11:           {title: "DM11"}
    DM0_pt1:        {title: "DM0 20<p_{t_{#tau}}<40"}
    DM0_pt2:        {title: "DM0 40<=p_{t_{#tau}}<60"}
    DM0_pt3:        {title: "DM0 60<=p_{t_{#tau}}<200"}
    DM1_pt1:        {title: "DM1 20<p_{t_{#tau}}<40"}
    DM1_pt2:        {title: "DM1 40<=p_{t_{#tau}}<60"}
    DM1_pt3:        {title: "DM1 60<=p_{t_{#tau}}<200"}
    DM10_pt1:       {title: "DM10 20<p_{t_{#tau}}<40"}
    DM10_pt2:       {title: "DM10 40<=p_{t_{#tau}}<60"}
    DM10_pt3:       {title: "DM10 60<=p_{t_{#tau}}<200"}
    DM11_pt1:       {title: "DM11 20<p_{t_{#tau}}<40"}
    DM11_pt2:       {title: "DM11 40<=p_{t_{#tau}}<60"}
    DM11_pt3:       {title: "DM11 60<=p_{t_{#tau}}<200"}

tid_SFRegions:
    DM0:            {title: "DM0"}
    DM1:            {title: "DM1"}
    recovAllDMs:    {title: "recovAllDMs"}
    DM10:           {title: "DM10"}
    DM11:           {title: "DM11"}
    DM0_pt1:        {title: "DM0 20<p_{t_{#tau}}<40"}
    DM0_pt2:        {title: "DM0 40<=p_{t_{#tau}}<60"}
    DM0_pt3:        {title: "DM0 60<=p_{t_{#tau}}<200"}
    DM1_pt1:        {title: "DM1 20<p_{t_{#tau}}<40"}
    DM1_pt2:        {title: "DM1 40<=p_{t_{#tau}}<60"}
    DM1_pt3:        {title: "DM1 60<=p_{t_{#tau}}<200"}
    DM10_pt1:       {title: "DM10 20<p_{t_{#tau}}<40"}
    DM10_pt2:       {title: "DM10 40<=p_{t_{#tau}}<60"}
    DM10_pt3:       {title: "DM10 60<=p_{t_{#tau}}<200"}
    DM11_pt1:       {title: "DM11 20<p_{t_{#tau}}<40"}
    DM11_pt2:       {title: "DM11 40<=p_{t_{#tau}}<60"}
    DM11_pt3:       {title: "DM11 60<=p_{t_{#tau}}<200"}

processes: ["ZTT","ZL","ZJ","W","VV","ST","TTT","TTL","TTJ","QCD","data_obs"]

systematics:
    LTF:
        effect: "shape"
        processes: ["ZL", "TTL"]
        name: "shape_mTauFake_$BIN"
        title: "+/- 3% LTF shape"
        variations: ["Up", "Down"]
        sampleAppend: ["_LTF1p030","_LTF0p970"]
    JTF:
        effect: "shape"
        processes: ["ZJ", "TTJ", "W"]
        name: "shape_jTauFake_$BIN"
        title: "+/- 10% JTF"
        variations: ["Up", "Down"]
        sampleAppend: ["_JTF1p100","_JTF0p900"]
    lumi:
        effect: "lnN"
        processes: ["ZTT", "ZL", "ZJ", "TTT", "TTL", "TTJ", "W", "ST", "VV"]
        scaleFactor: 1.025
    eff_m:
        effect: "lnN"
        processes: ["ZTT", "ZL", "ZJ", "TTT", "TTL", "TTJ", "W", "ST", "VV"]
        scaleFactor: 1.02
    muonFakerate:
        effect: "lnN"
        processes: ["ZL", "TTL"]
        scaleFactor: 1.50
    xsec_dy:
       effect: "lnN"
       processes: ["ZTT", "ZL", "ZJ"]
       scaleFactor: 1.02
    xsec_tt:
        effect: "lnN"
        processes: ["TTT", "TTL", "TTJ"]
        scaleFactor: 1.06
    xsec_st:
        effect: "lnN"
        processes: ["ST"]
        scaleFactor: 1.05
    xsec_vv:
        effect: "lnN"
        processes: ["VV"]
        scaleFactor: 1.05
    norm_wj:
        effect: "lnN"
        processes: ["W"]
        scaleFactor: 1.08
    norm_qcd:
        effect: "lnN"
        processes: ["QCD"]
        scaleFactor: 1.20
    rate_jTauFake_$BIN:
        effect: "lnN"
        processes: ["W","QCD","ZJ","TTJ"]
        scaleFactor: 1.15
